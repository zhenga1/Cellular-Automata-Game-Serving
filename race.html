<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Race the Solver · Play</title>
<meta name="description" content="Play a level side by side with the Solver, which knows the answer but takes its time.">
<style>
:root{--bg:#15171c;--panel:rgba(22,24,30,.92);--border:rgba(255,255,255,.08);--text:#e8e9ec;--muted:#9095a1;
      --accent:#7cc4ff;--good:#7fe0a6;--bad:#ff8a80;--solver:#ffc46b}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
          font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
header{height:56px;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--border)}
header .back{color:var(--muted);text-decoration:none;font-weight:600}
header .back:hover{color:var(--text)}
header h1{margin:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 .vs{color:var(--muted);font-weight:500}
.spacer{flex:1}
.clock{font:600 15px ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums;
       padding:6px 10px;border-radius:8px;border:1px solid var(--border);white-space:nowrap}
.clock span{font:600 11px system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;margin-right:8px}
#clock-you span{color:var(--accent)}
#clock-solver span{color:var(--solver)}
.clock.done{border-color:currentColor}
#clock-you.done{color:var(--good)}
#clock-solver.done{color:var(--solver)}
label.pace{color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
select,button{font:inherit;color:var(--text);background:#22252d;border:1px solid var(--border);border-radius:8px;padding:7px 10px}
button{cursor:pointer;font-weight:600}
button.go{background:var(--accent);color:#0d0f14;border-color:transparent;padding:8px 18px;font-size:14px}
button:disabled{opacity:.5;cursor:default}
.arena{position:absolute;top:56px;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#000}
.side{position:relative;min-width:0;min-height:0}
.side iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}
#solver{pointer-events:none}
.tag{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:2;pointer-events:none;
     font:700 12px system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border-radius:999px;
     background:rgba(10,11,14,.75);border:1px solid currentColor}
.tag.you{color:var(--accent)}
.tag.solver{color:var(--solver)}
#countdown{position:fixed;inset:56px 0 0;display:grid;place-items:center;z-index:10;pointer-events:none;
           font:800 min(28vw,220px)/1 system-ui,sans-serif;color:#fff;text-shadow:0 8px 40px rgba(0,0,0,.6)}
#countdown.pop{animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(1.6);opacity:0}25%{opacity:1}100%{transform:scale(1);opacity:.15}}
#verdict{position:fixed;left:50%;top:72px;transform:translateX(-50%);z-index:11;width:min(560px,calc(100vw - 32px));
         background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 20px;
         box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:center;backdrop-filter:blur(8px)}
#verdict h2{margin:0 0 4px;font-size:20px}
#verdict p{margin:0 0 12px;color:var(--muted)}
#verdict.win h2{color:var(--good)}
#verdict.lose h2{color:var(--solver)}
#verdict .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#note{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);z-index:11;background:var(--panel);
      border:1px solid var(--border);border-radius:10px;padding:8px 14px;color:var(--bad);font-weight:600}
#missing{position:fixed;inset:56px 0 0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
@media (max-width:820px){
  header{height:auto;min-height:56px;flex-wrap:wrap;padding:8px 12px;gap:8px 12px}
  .arena{top:104px;grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  label.pace{display:none}
}
</style>
</head>
<body>
<header>
  <a class="back" id="back" href="play.html">&larr; Play</a>
  <h1><span id="level-name">Race</span> <span class="vs">· You vs the Solver</span></h1>
  <div class="spacer"></div>
  <div class="clock" id="clock-you"><span>You</span><b>0:00.0</b></div>
  <div class="clock" id="clock-solver"><span>Solver</span><b>0:00.0</b></div>
  <label class="pace">Solver speed
    <select id="pace">
      <option value="1.6">Very slow</option>
      <option value="1" selected>Slow</option>
      <option value="0.55">Quick</option>
    </select>
  </label>
  <button class="go" id="go" disabled>Loading…</button>
</header>

<main class="arena" id="arena">
  <section class="side"><iframe id="you" title="Your game"></iframe><div class="tag you">You</div></section>
  <section class="side"><iframe id="solver" title="The Solver's game" tabindex="-1"></iframe><div class="tag solver">Solver</div></section>
</main>

<div id="countdown" hidden></div>
<div id="note" hidden></div>
<div id="verdict" role="dialog" aria-live="polite" hidden>
  <h2 id="verdict-title"></h2>
  <p id="verdict-text"></p>
  <div class="row">
    <button class="go" id="rematch">Rematch</button>
    <button id="close">Keep watching</button>
    <a id="solo" href="play.html"><button type="button">Play it solo</button></a>
  </div>
</div>
<div id="missing" hidden></div>

<script>
// Two Play pages side by side: ?race=you on the left for the player, and
// ?race=solver on the right, where a scripted solver plays the level's known
// answer slowly (see "race" in play.html). Each page is its own copy of the
// simulation; this page only starts them together and keeps time.
const $ = id => document.getElementById(id);
const id = new URLSearchParams(location.search).get("level") || "lava-fork";
const fmt = ms => { const s = ms / 1000; return Math.floor(s / 60) + ":" + (s % 60).toFixed(1).padStart(4, "0"); };

const sides = {
  you:    {frame: $("you"),    clock: $("clock-you"),    ready: false, done: null},
  solver: {frame: $("solver"), clock: $("clock-solver"), ready: false, done: null},
};
let t0 = 0, running = false, winner = null, noteTimer = null;

fetch("levels/levels.json").then(r => r.json()).then(({levels}) => {
  const level = levels.find(l => l.id === id);
  const raceable = levels.filter(l => l.solution);
  if (!level || !level.solution) {
    $("arena").hidden = true;
    $("missing").hidden = false;
    $("missing").innerHTML = "<div><p>The Solver doesn't know an answer to " + (level ? level.name : "that level") +
      " yet.</p><p>" + raceable.map(l => '<a href="race.html?level=' + encodeURIComponent(l.id) + '">' + l.name + "</a>").join(" · ") + "</p></div>";
    $("go").textContent = "No race";
    return;
  }
  document.title = level.name + " · Race the Solver";
  $("level-name").textContent = level.name;
  $("back").href = $("solo").href = "play.html?level=" + encodeURIComponent(id);
  for (const who of ["you", "solver"]) {
    sides[who].frame.src = "play.html?level=" + encodeURIComponent(id) + "&race=" + who;
  }
}).catch(() => { $("go").textContent = "Could not load"; });

window.addEventListener("message", e => {
  if (e.origin !== location.origin || !e.data || !sides[e.data.race]) return;
  const side = sides[e.data.race];
  if (e.data.type === "ready") {
    side.ready = true;
    if (sides.you.ready && sides.solver.ready && !running) {
      $("go").disabled = false;
      $("go").textContent = "Start!";
    }
  } else if (e.data.type === "done" && running) {
    if (!e.data.won) {
      if (e.data.race === "you") note("That attempt failed. Press Try again in your game, the clock is still running.");
      return;
    }
    if (side.done !== null) return;
    side.done = performance.now() - t0;
    side.clock.classList.add("done");
    side.clock.querySelector("b").textContent = fmt(side.done);
    if (!winner) {
      winner = e.data.race;
      showVerdict();
    }
  }
});

function note(text) {
  $("note").textContent = text;
  $("note").hidden = false;
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => { $("note").hidden = true; }, 5000);
}

function showVerdict() {
  const v = $("verdict");
  v.className = winner === "you" ? "win" : "lose";
  $("verdict-title").textContent = winner === "you" ? "You beat the Solver!" : "The Solver got there first";
  $("verdict-text").textContent = winner === "you"
    ? "You finished in " + fmt(sides.you.done) + ". The Solver is still working on it."
    : "The Solver finished in " + fmt(sides.solver.done) + ". Your game keeps going, so you can still finish it.";
  v.hidden = false;
}

function tick() {
  if (!running) return;
  const now = performance.now() - t0;
  for (const side of Object.values(sides)) {
    if (side.done === null) side.clock.querySelector("b").textContent = fmt(now);
  }
  requestAnimationFrame(tick);
}

async function countdown() {
  const box = $("countdown");
  box.hidden = false;
  for (const n of ["3", "2", "1", "Go!"]) {
    box.textContent = n;
    box.classList.remove("pop");
    void box.offsetWidth;            // restart the animation
    box.classList.add("pop");
    await new Promise(r => setTimeout(r, n === "Go!" ? 600 : 900));
    if (n === "1") break;
  }
  box.textContent = "Go!";
  setTimeout(() => { box.hidden = true; }, 700);
}

$("go").addEventListener("click", async () => {
  $("go").disabled = true;
  $("pace").disabled = true;
  $("go").textContent = "Racing…";
  await countdown();
  t0 = performance.now();
  running = true;
  const pace = $("pace").value;
  for (const side of Object.values(sides)) side.frame.contentWindow.postMessage({type: "go", pace}, location.origin);
  sides.you.frame.focus();
  requestAnimationFrame(tick);
});
$("rematch").addEventListener("click", () => location.reload());
$("close").addEventListener("click", () => { $("verdict").hidden = true; sides.you.frame.focus(); });
</script>
</body>
</html>
